# portals.yml — Job Portal & Company Configuration
# Customize this file to define which companies to scan, what titles interest you,
# and which job boards to search.

title_filter:
  # Positive keywords: At least ONE must appear in job title (case-insensitive)
  positive:
    - QA
    - "Quality Assurance"
    - "Test"
    - "Automation Engineer"
    - "QA Engineer"
    - "Test Automation"
    - "SDET"
    - "Test Architecture"
    - "QA Lead"
    - "Test Lead"
    - "QA Manager"
    - "Test Manager"

  # Negative keywords: NONE should appear in job title
  negative:
    - "Junior"
    - "Fresher"
    - "Internship"
    - ".NET"
    - "Java Developer"
    - "DevOps"
    - "Manual"

  # Seniority boost keywords: Give priority to these (but not required)
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Architect"
    - "Lead"
    - "Manager"

tracked_companies:
  # High-priority tech companies known for strong QA practices
  # Format: List of companies with careers_url for Playwright navigation

  # Tier 1: Unicorns & Tech Giants
  - name: Anthropic
    careers_url: https://www.anthropic.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    enabled: true

  - name: Stripe
    careers_url: https://stripe.com/jobs
    api: https://boards-api.greenhouse.io/v1/boards/stripe/jobs
    enabled: true

  - name: Databricks
    careers_url: https://www.databricks.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/databricks/jobs
    enabled: true

  - name: Figma
    careers_url: https://www.figma.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/figma/jobs
    enabled: true

  - name: Canva
    careers_url: https://www.canva.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/canva/jobs
    enabled: true

  # Tier 2: Scale-ups & Growth Companies
  - name: Notion
    # Moved off Greenhouse → Ashby (2026-06; old greenhouse/notion board 404s).
    # Ashby provider auto-detects from the jobs.ashbyhq.com/<slug> careers_url.
    careers_url: https://jobs.ashbyhq.com/notion
    enabled: true

  - name: Airtable
    careers_url: https://airtable.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/airtable/jobs
    enabled: true

  - name: Retool
    careers_url: https://retool.com/careers
    enabled: true

  - name: Zapier
    careers_url: https://zapier.com/jobs
    api: https://boards-api.greenhouse.io/v1/boards/zapier/jobs
    enabled: true

  - name: Vercel
    careers_url: https://vercel.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/vercel/jobs
    enabled: true

  - name: Supabase
    careers_url: https://supabase.com/careers
    enabled: true

  - name: Plane
    careers_url: https://plane.so/careers
    enabled: true

  # Tier 3: India-based / APAC Companies
  - name: EasyPost
    careers_url: https://www.easypost.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/easypost/jobs
    enabled: true

  - name: Razorpay
    careers_url: https://razorpay.com/careers
    enabled: true

  - name: Freshworks
    careers_url: https://www.freshworks.com/careers
    api: https://boards-api.greenhouse.io/v1/boards/freshworks/jobs
    enabled: true

  - name: ByteBeam
    careers_url: https://www.bytebeam.io/careers
    enabled: true

search_queries:
  # Search queries for broad job board discovery
  # Use these to find jobs you may not have tracked companies for yet

  - name: QA Engineer remote scale-up
    query: 'QA Engineer remote scale-up site:ashby.com OR site:lever.co OR site:greenhouse.io'
    enabled: true

  - name: Test Automation Engineer remote
    query: 'Test Automation Engineer remote India OR remote-first site:linkedin.com'
    enabled: true

  - name: Senior QA
    query: 'Senior QA site:we-are-hiring.com OR site:builtin.com'
    enabled: true

  - name: QA Lead OR Test Architect
    query: 'QA Lead OR Test Architect remote-first scale-up site:ashby.com OR site:lever.co'
    enabled: true

  - name: Testing strategy senior engineer
    query: 'Testing strategy senior engineer remote OR India site:ashby.com OR site:greenhouse.io'
    enabled: true

scanner:
  # Number of parallel companies to scan (use 3-5 to avoid rate limiting)
  parallel_batch_size: 3

  # Verify URLs from WebSearch by checking if they're still active
  verify_urls_from_websearch: true

  # Store full job descriptions in jds/ directory
  save_jds: true

  # Update scan history with every scan
  track_scans: true

  # Dedup against multiple sources
  dedup_sources:
    - scan_history
    - applications_tracker
    - pipeline
