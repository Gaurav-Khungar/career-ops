# portals.yml — Job Portal & Company Configuration
# Customize this file to define which companies to scan, what titles interest you,
# and which job boards to search.
#
# Rebuilt 2026-07-03:
# - Removed dead Greenhouse boards (Canva, EasyPost, Freshworks — 404 for weeks)
# - Notion + Zapier moved to their real Ashby boards; Supabase enabled via Ashby
# - Added 18 companies with a verified history of posting QA/SDET roles
#   (slugs API-tested on 2026-07-03, job counts in comments)
# - Title filter tuned to the real CV (Senior QA / SDET / Automation, manual OK)
# - Added location_filter: India-remote focus (biggest historical waste was
#   evaluating US-only roles)

title_filter:
  # Positive keywords: At least ONE must appear in job title (case-insensitive,
  # word-boundary matched — "Test" does not match "Tester", so both are listed)
  positive:
    - QA
    - "Quality Assurance"
    - "Quality Engineer"
    - "Quality Analyst"
    - "Test"
    - "Tester"
    - "Testing"
    - "SDET"
    - "Automation Engineer"
    - "Test Automation"

  # Negative keywords: NONE should appear in job title
  # NOTE: "Manual" removed 2026-07-03 — the real CV is strong in manual/exploratory
  # testing; manual QA titles are now evaluated instead of silently dropped.
  negative:
    - "Junior"
    - "Fresher"
    - "Intern"
    - "Internship"
    - ".NET"
    - "Java Developer"
    - "DevOps"
    - "Director"
    - "Head of"

  # Seniority boost keywords: Give priority to these (but not required)
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Lead"

# Location filter (scan.mjs semantics):
# - empty/missing location on a job → passes (never penalize missing data)
# - always_allow match → passes even if a blocked term also appears
# - allow list non-empty → location must match at least one term
# Rationale: historically the single biggest source of wasted evaluations was
# US/EU-only postings. This keeps India + remote-friendly locations and
# multi-location strings that include them.
location_filter:
  always_allow:
    - india
    - remote
    - anywhere
    - worldwide
    - global
    - work from home
  allow:
    - india
    - remote
    - anywhere
    - worldwide
    - global
    - apac
    - bengaluru
    - bangalore
    - hyderabad
    - pune
    - mumbai
    - delhi
    - gurgaon
    - gurugram
    - noida
    - chennai

