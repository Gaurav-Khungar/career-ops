---

# Search Queries for Broad Job Board Discovery
# Use these to find jobs you may not have tracked companies for yet
search_queries:
  query_1:
    query: "QA Engineer remote scale-up site:ashby.com OR site:lever.co OR site:greenhouse.io"
    enabled: true
    source: "job_boards"

  query_2:
    query: "Test Automation Engineer remote India OR remote-first site:linkedin.com"
    enabled: true
    source: "linkedin"

  query_3:
    query: "Senior QA site:we-are-hiring.com OR site:builtin.com"
    enabled: true
    source: "job_boards"

  query_4:
    query: "QA Lead OR Test Architect remote-first scale-up site:lunchlist.com OR site:hackernews.com"
    enabled: true
    source: "community"

  query_5:
    query: "Testing strategy senior engineer remote OR India site:ashby.com OR site:greenhouse.io"
    enabled: true
    source: "job_boards"

---

# Scanner Configuration
scanner:
  # Number of parallel companies to scan (use 3-5 to avoid rate limiting)
  parallel_batch_size: 3

  # Verify URLs from WebSearch (Level 3) by checking if they're still active
  verify_urls_from_websearch: true

  # Store full job descriptions in jds/ directory
  save_jds: true

  # Update scan history with every scan (creates audit trail)
  track_scans: true

  # Dedup against multiple sources
  dedup_sources:
    - scan_history
    - applications_tracker
    - pipeline

---

# Notes
# - Edit `title_filter.positive` to match YOUR target roles
# - Add/remove companies in `tracked_companies` as needed
# - Update `search_queries` to search the job boards YOU use
# - Negative keywords help filter out irrelevant results
# - `seniority_boost` keywords improve ranking but aren't required
