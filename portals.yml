search_queries:
  # Search queries for broad job board discovery (used by WebSearch fallback)

  - name: Senior QA Engineer India remote
    query: '"Senior QA Engineer" OR "QA Engineer" India remote SaaS site:jobs.lever.co OR site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com'
    enabled: true

  - name: QA Automation Cypress Playwright India
    query: 'QA Automation Engineer Cypress OR Playwright India remote'
    enabled: true

  - name: Mobile QA India remote
    query: 'Mobile QA Engineer Android iOS India remote Maestro OR Appium'
    enabled: true

  - name: SDET India remote
    query: 'SDET India remote site:jobs.lever.co OR site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com'
    enabled: true

  - name: CCaaS telephony CRM QA
    query: 'QA Engineer CCaaS OR telephony OR "contact center" OR CRM integrations remote India'
    enabled: true

scanner:
  # Number of parallel companies to scan (use 3-5 to avoid rate limiting)
  parallel_batch_size: 3

  # Verify URLs from WebSearch by checking if they're still active
  verify_urls_from_websearch: true

  # Store full job descriptions in jds/ directory
  save_jds: true

  # Update scan history with every scan
  track_scans: true

  # Dedup against multiple sources
  dedup_sources:
    - scan_history
    - applications_tracker
    - pipeline
